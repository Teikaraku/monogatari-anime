# Include inside the bgm.monogatari.top HTTPS server. The surrounding /p1/
# location intentionally stays GET/HEAD-only; this is a read-only search API.
location = /p1/search/subjects {
    limit_req zone=mono_anime_api_ip burst=60 nodelay;
    limit_except GET HEAD POST { deny all; }
    set $bgm_upstream next.bgm.tv;
    proxy_pass https://$bgm_upstream;
    include /etc/nginx/snippets/monogatari-anime-proxy.conf;
    proxy_set_header Host next.bgm.tv;
    proxy_cache mono_anime_api;
    proxy_cache_methods GET HEAD POST;
    proxy_cache_key "$request_method|$request_uri|$request_body";
    proxy_cache_valid 200 10m;
    proxy_cache_bypass $http_authorization;
    proxy_no_cache $http_authorization;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header X-Cache $upstream_cache_status always;
}
