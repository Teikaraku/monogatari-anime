    location = /public/mikan/Home/Search {
        limit_except GET HEAD { deny all; }
        limit_req zone=mono_anime_api_ip burst=60 nodelay;
        include /etc/nginx/snippets/monogatari-anime-proxy.conf;
        proxy_set_header Host $bgm_upstream;
        proxy_set_header Authorization "";
        proxy_cache mono_anime_api;
        proxy_cache_valid 200 1m;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status always;
        if ($args !~ "^searchstr=[^&]{0,600}$") { return 400; }
        set $bgm_upstream mikanani.me;
        rewrite ^ /Home/Search break;
        proxy_pass https://$bgm_upstream;
    }
    location = /public/mikan/RSS/Bangumi {
        limit_except GET HEAD { deny all; }
        limit_req zone=mono_anime_api_ip burst=60 nodelay;
        include /etc/nginx/snippets/monogatari-anime-proxy.conf;
        proxy_set_header Host $bgm_upstream;
        proxy_set_header Authorization "";
        proxy_cache mono_anime_api;
        proxy_cache_valid 200 1m;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status always;
        if ($args !~ "^(?:bangumiId=[0-9]+&subgroupid=[0-9]+|bangumiId=[0-9]+)$") { return 400; }
        set $bgm_upstream mikanani.me;
        rewrite ^ /RSS/Bangumi break;
        proxy_pass https://$bgm_upstream;
    }
    location ~ "^/public/mikan/(Home/Bangumi/[0-9]{1,10}|Home/Episode/[a-fA-F0-9]{40}|Download/[0-9]{8}/[a-fA-F0-9]{40}\.torrent)/?$" {
        limit_except GET HEAD { deny all; }
        limit_req zone=mono_anime_api_ip burst=60 nodelay;
        include /etc/nginx/snippets/monogatari-anime-proxy.conf;
        proxy_set_header Host $bgm_upstream;
        proxy_set_header Authorization "";
        proxy_cache mono_anime_api;
        proxy_cache_valid 200 1m;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status always;
        if ($args != "") { return 400; }
        set $bgm_upstream mikanani.me;
        rewrite ^/public/mikan(/.*)$ $1 break;
        proxy_pass https://$bgm_upstream;
    }
    location /public/ { return 404; }
